version: 1
devices:
  # A comma belongs to the smartctl device type itself (`-d sat,auto`), it does not
  # separate two types. Both the scalar form (/dev/sda) and the list form (/dev/sdb)
  # must preserve it as a single value.
  - device: /dev/sda
    type: 'sat,auto'
  - device: /dev/sdb
    type:
      - sat,auto
