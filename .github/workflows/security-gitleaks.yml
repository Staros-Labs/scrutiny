name: Gitleaks Security

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      scan_history:
        description: Scan all reachable Git history instead of the checked-out tree.
        required: false
        type: boolean
        default: false
      test_fixture:
        description: Run disposable synthetic credential detection test.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  gitleaks:
    uses: Staros-Labs/infra/.github/workflows/reusable-security-gitleaks.yml@2f8e26ea833c4b728a06317e1e4870831c416438
    with:
      report_only: true
      scan_history: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.scan_history) }}
      test_fixture: ${{ github.event_name == 'workflow_dispatch' && inputs.test_fixture }}
    permissions:
      contents: read
